name: Translation
description: Correct a translated line, or paste a translated Locales file, and I'll add it.
labels: [enhancement]
body:
  - type: dropdown
    id: locale
    attributes:
      label: Locale
      options:
        - deDE
        - esES
        - esMX
        - frFR
        - koKR
        - ptBR
        - ruRU
        - zhCN
        - zhTW
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Lines
      description: >-
        The lines you corrected, copied from `Locales/<locale>.lua` with the right-hand side fixed, or your copy of
        `Locales/phrases.txt` with the right-hand sides translated. Lines you leave out stay as they are.
      render: lua
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything worth knowing, such as where the line shows in game or phrases you weren't sure about.
