name: Wrong data
description: A level range, dungeon entrance, trainer spell, camp benefit or other thing Tweaks shows differs from what the game does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for checking. What the game itself shows is what Tweaks has to match, so the most useful thing is what you saw in game next to what Tweaks said.
  - type: textarea
    id: report
    attributes:
      label: /tweaks report output
      description: Type `/tweaks report` in game, where you saw the problem if you can. A window opens with the text already selected. Press Ctrl+C (Cmd+C on a Mac) and paste it here.
      render: text
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Feature
      description: The Tweaks option involved, as it reads in the settings.
      placeholder: Zone level ranges on the map
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: What Tweaks shows
      description: What you saw and where (map, tooltip, spellbook, trainer window), with the zone, NPC, spell or dungeon name.
      placeholder: The map shows Duskwood as 10-20.
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: What the game does
      description: What the game itself shows or did, and your level at the time.
      placeholder: Duskwood quests are level 18-30.
    validations:
      required: true
