name: Refresh game data

# Opens a PR with regenerated data when wago.tools lists a newer Forever build.
# PRs opened with GITHUB_TOKEN don't trigger CI, so this job runs the full checks itself.
# Daily: beta builds have shipped several times a week.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the newest Forever build
        id: build
        run: |
          build=$(python3 tools/latest_build.py)
          echo "version=$build" >> "$GITHUB_OUTPUT"
          if grep -q "^BUILD = \"$build\"" tools/gen_overlays.py; then
            echo "already on $build"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^BUILD = \".*\"/BUILD = \"$build\"/" tools/gen_overlays.py tools/gen_camp.py tools/gen_zonelevels.py
      - if: steps.build.outputs.new == 'true'
        run: python3 tools/gen_overlays.py && python3 tools/gen_camp.py && python3 tools/gen_zonelevels.py
      - if: steps.build.outputs.new == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y luajit lua-check
          luacheck .
          for spec in tests/*_spec.lua; do luajit "$spec" || exit 1; done
      - if: steps.build.outputs.new == 'true'
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .
      - if: steps.build.outputs.new == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: data/forever-${{ steps.build.outputs.version }}
          title: "data: game data for Forever ${{ steps.build.outputs.version }}"
          commit-message: "data: game data for Forever ${{ steps.build.outputs.version }}"
          body: |
            Regenerated `Data/Overlays.lua` (world map overlays), `Data/CampBenefits.lua` (camp benefit texts) and `Data/ZoneLevels.lua` (zone level ranges) from the DB2s of Forever build ${{ steps.build.outputs.version }}.

            Before merging, open a few zone maps with *Reveal unexplored areas* on and check the tinted areas line up, and read the diffs of `Data/CampBenefits.lua` and `Data/ZoneLevels.lua` for changed numbers.
