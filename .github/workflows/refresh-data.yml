name: Refresh map data

# Opens a PR with regenerated data when wago.tools lists a newer Forever build.
# PRs opened with GITHUB_TOKEN don't trigger CI, so this job runs the full checks itself.
# Daily: beta builds have shipped several times a week.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin the newest Forever build
        id: build
        run: |
          build=$(python3 tools/latest_build.py)
          echo "version=$build" >> "$GITHUB_OUTPUT"
          if grep -q "^BUILD = \"$build\"" tools/gen_overlays.py; then
            echo "already on $build"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^BUILD = \".*\"/BUILD = \"$build\"/" tools/gen_overlays.py
      - if: steps.build.outputs.new == 'true'
        run: python3 tools/gen_overlays.py
      - if: steps.build.outputs.new == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y luajit lua-check
          luacheck .
          for spec in tests/*_spec.lua; do luajit "$spec" || exit 1; done
      - if: steps.build.outputs.new == 'true'
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
      - if: steps.build.outputs.new == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/forever-${{ steps.build.outputs.version }}
          title: "data: map overlays for Forever ${{ steps.build.outputs.version }}"
          commit-message: "data: map overlays for Forever ${{ steps.build.outputs.version }}"
          body: |
            Regenerated `Data/Overlays.lua` from the world map overlay DB2s of Forever build ${{ steps.build.outputs.version }}.

            Before merging, open a few zone maps with *Reveal unexplored areas* on and check the tinted areas line up.
