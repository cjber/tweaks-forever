name: Refresh game data

# Opens a PR with regenerated data when wago.tools lists a newer Forever build.
# CI on a PR opened with GITHUB_TOKEN waits for a maintainer's approval, so the Lua checks run here
# first and the ci job dispatches the full CI on the PR's branch.
# Daily: beta builds have shipped several times a week.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the newest Forever build
        id: build
        run: |
          build=$(python3 tools/latest_build.py)
          echo "version=$build" >> "$GITHUB_OUTPUT"
          if grep -q "^BUILD = \"$build\"" tools/gen_overlays.py; then
            echo "already on $build"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^BUILD = \".*\"/BUILD = \"$build\"/" tools/gen_overlays.py tools/gen_camp.py tools/gen_zonelevels.py tools/gen_dungeons.py tools/gen_classspells.py tools/gen_foreverquests.py
      - if: steps.build.outputs.new == 'true'
        run: python3 tools/gen_overlays.py && python3 tools/gen_camp.py && python3 tools/gen_zonelevels.py && python3 tools/gen_dungeons.py && python3 tools/gen_classspells.py && python3 tools/gen_foreverquests.py
      - if: steps.build.outputs.new == 'true'
        run: python3 tools/check_generated.py --offline
      - if: steps.build.outputs.new == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y luajit lua-check
          luacheck .
          for spec in tests/*_spec.lua; do luajit "$spec" || exit 1; done
      - if: steps.build.outputs.new == 'true'
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .
      - if: steps.build.outputs.new == 'true'
        id: report
        run: |
          {
            echo 'markdown<<REPORT_EOF'
            python3 tools/data_report.py
            echo REPORT_EOF
          } >> "$GITHUB_OUTPUT"
      - if: steps.build.outputs.new == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: data/forever-${{ steps.build.outputs.version }}
          title: "data: game data for Forever ${{ steps.build.outputs.version }}"
          commit-message: "data: game data for Forever ${{ steps.build.outputs.version }}"
          body: |
            Regenerated `Data/Overlays.lua` (world map overlays), `Data/CampBenefits.lua` (camp benefit texts), `Data/ZoneLevels.lua` (zone level ranges), `Data/DungeonEntrances.lua` (dungeon and raid entrances), `Data/ClassSpells.lua` (class trainer spells) and `Data/ForeverQuests.lua` (quests added in Forever) for Forever build ${{ steps.build.outputs.version }}; `tools/README.md` names each file's sources.

            ${{ steps.report.outputs.markdown }}

            Before merging, open a few zone maps with *Reveal unexplored areas* on and check the tinted areas line up and the entrance pins sit on their dungeons, and read the diffs of `Data/CampBenefits.lua` and `Data/ZoneLevels.lua` for changed numbers, `Data/ClassSpells.lua` for spells that dropped out, and `Data/ForeverQuests.lua` for quest IDs that dropped out.

            CI is dispatched on this branch straight away; approve the pending workflows on this PR too, since only those count as its required checks.

  ci:
    needs: refresh
    if: needs.refresh.outputs.operation == 'created' || needs.refresh.outputs.operation == 'updated'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.refresh.outputs.branch }}

  # A refresh that fails unseen is how the data falls behind the client: one open issue says so.
  report:
    needs: [refresh, ci]
    if: failure() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Data refresh failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The data refresh failed: $RUN_URL

          A generator rejects client data it cannot place, so read the error in that run, correct the generator from the new client rows, and close this issue once a run passes."
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
