name: Refresh game data

# Opens a PR with regenerated data when wago.tools lists a newer Forever build.
# The Lua checks run here first; GitHub holds the CI of a PR that GITHUB_TOKEN opened, so the ci job approves it.
# Daily: beta builds have shipped several times a week.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned inputs CI already downloaded, such as frozen dumps; each file is keyed by its pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py') }}
          restore-keys: regeneration-${{ runner.os }}-
      - name: Pin the newest Forever build
        id: build
        run: |
          build=$(python3 tools/latest_build.py)
          echo "version=$build" >> "$GITHUB_OUTPUT"
          if grep -q "^BUILD = \"$build\"" tools/gen_overlays.py; then
            echo "already on $build"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^BUILD = \".*\"/BUILD = \"$build\"/" tools/gen_overlays.py tools/gen_camp.py tools/gen_zonelevels.py tools/gen_dungeons.py tools/gen_classspells.py tools/gen_foreverquests.py
      - if: steps.build.outputs.new == 'true'
        run: python3 tools/gen_overlays.py && python3 tools/gen_camp.py && python3 tools/gen_zonelevels.py && python3 tools/gen_dungeons.py && python3 tools/gen_classspells.py && python3 tools/gen_foreverquests.py
      - if: steps.build.outputs.new == 'true'
        run: python3 tools/check_generated.py --offline
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT and luacheck
        if: steps.build.outputs.new == 'true'
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
          LUACHECK: 1.1.2-1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT" "lua-check=$LUACHECK"
      - if: steps.build.outputs.new == 'true'
        name: Read the Forever Core ref
        id: forever-core
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - if: steps.build.outputs.new == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core.outputs.ref }}
          path: forever-core
          persist-credentials: false
      - if: steps.build.outputs.new == 'true'
        env:
          FOREVER_CORE: forever-core
        run: |
          luacheck .
          python3 -m tools.forever_tools.specs
      - if: steps.build.outputs.new == 'true'
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .
      - if: steps.build.outputs.new == 'true'
        id: report
        run: |
          {
            echo 'markdown<<REPORT_EOF'
            python3 tools/data_report.py
            echo REPORT_EOF
          } >> "$GITHUB_OUTPUT"
      - if: steps.build.outputs.new == 'true'
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: data/forever-${{ steps.build.outputs.version }}
          title: "data: game data for Forever ${{ steps.build.outputs.version }}"
          commit-message: "data: game data for Forever ${{ steps.build.outputs.version }}"
          body: |
            Regenerated `Data/Overlays.lua` (world map overlays), `Data/CampBenefits.lua` (camp benefit texts), `Data/ZoneLevels.lua` (zone level ranges), `Data/DungeonEntrances.lua` (dungeon and raid entrances), `Data/ClassSpells.lua` (class trainer spells) and `Data/ForeverQuests.lua` (quests added in Forever) for Forever build ${{ steps.build.outputs.version }}; `tools/README.md` names each file's sources.

            ${{ steps.report.outputs.markdown }}

            Before merging, open a few zone maps with *Reveal unexplored areas* on and check the tinted areas line up and the entrance pins sit on their dungeons, and read the diffs of `Data/CampBenefits.lua` and `Data/ZoneLevels.lua` for changed numbers, `Data/ClassSpells.lua` for spells that dropped out, and `Data/ForeverQuests.lua` for quest IDs that dropped out.

            The workflow that opened this PR also approved its CI, so the required checks run without a maintainer's approval.

  # GitHub holds every pull_request run on a PR that GITHUB_TOKEN opened until someone with write access approves
  # it: the held run has no jobs and no log, and it ends as a failure when the PR closes. Approve the PR commit's held
  # runs (CI and Speedpatrol) so its required checks run on their own. GitHub creates them a few seconds after the push.
  ci:
    needs: refresh
    if: needs.refresh.outputs.operation == 'created' || needs.refresh.outputs.operation == 'updated'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Approve the PR's held workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.refresh.outputs.sha }}
        run: |
          for _ in $(seq 30); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$SHA" \
              --jq '.workflow_runs[] | "\(.id) \(.conclusion)"')
            held=$(printf '%s\n' "$runs" | awk '$2 == "action_required" { print $1 }')
            for id in $held; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null
              echo "Approved run $id"
            done
            if [ -n "$runs" ] && [ -z "$held" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The pull_request runs for $SHA were not created or not approved"
          exit 1

  # A refresh that fails unseen is how the data falls behind the client: one open issue says so.
  report:
    needs: [refresh, ci]
    # The first attempt stays quiet: retry-refresh.yml re-runs it, and only a failed re-run is reported.
    if: failure() && github.run_attempt > 1 && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Data refresh failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The data refresh failed: $RUN_URL

          A generator rejects client data it cannot place, so read the error in that run, correct the generator from the new client rows, and close this issue once a run passes."
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
