name: Speedpatrol

# Times this PR against its base branch in alternating A/B rounds on one runner, comments the table on the PR and
# fails on a regression. Tweaks has no bench script, so the spec suite is what is
# timed; the typecheck timing is for the local patrol.
on:
  pull_request:
    # labeled re-runs the timing when the "speedpatrol: accept" label is added; naming types replaces the defaults.
    types: [opened, synchronize, reopened, labeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  speedpatrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Forever Core ref
        id: forever-core
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Every Lua tool version lives in this checkout's tools/toolchain.json; the action installs and verifies the pin.
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        with:
          tools: lua
      - uses: agent-labs-dev/speedpatrol@6f86e2ea61e004c78c18de41ad052c9f55ab5a19 # v0
        with:
          benchmarks: gate.specs
          fail-on-regression: true
          rounds: 3
          package: speedpatrol@0.2.0
